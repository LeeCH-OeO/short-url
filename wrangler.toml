name = "short-url"
main = "worker/index.js"
compatibility_date = "2025-01-01"

[assets]
directory = "./dist"
binding = "ASSETS"
not_found_handling = "single-page-application"
run_worker_first = true

[[d1_databases]]
binding = "URLS_DB"
database_name = "short-url-db"
database_id = "578cf1c9-e8c6-4776-8164-c45ce28040e5"
migrations_dir = "worker/migrations"

[vars]
APP_BASE_URL = "https://st.ch-lee.xyz"

[[routes]]
pattern = "st.ch-lee.xyz/*"
zone_name = "ch-lee.xyz"

[[ratelimits]]
name = "SHORTEN_RATE_LIMITER"
namespace_id = "12001"
simple = { limit = 20, period = 60 }
